<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Tracker Pro</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>💰 Finance Tracker Pro💰</h1>

        <div class="dashboard">

            <div class="card income">

                <h3>Income</h3>

                <h2>Ksh <span id="income">0</span></h2>

            </div>

            <div class="card expense">

                <h3>Expense</h3>

                <h2>Ksh <span id="expense">0</span></h2>

            </div>

            <div class="card balance">

                <h3>Balance</h3>

                <h2>Ksh <span id="balance">0</span></h2>

            </div>

        </div>

        <div class="form">

            <input type="text" id="description" placeholder="Description">

            <input type="number" id="amount" placeholder="Amount">

            <select id="type">

                <option value="Income">Income</option>

                <option value="Expense">Expense</option>

            </select>

            <select id="category">

                <option>Salary</option>

                <option>Food</option>

                <option>Transport</option>

                <option>Rent</option>

                <option>Shopping</option>

                <option>Entertainment</option>

                <option>Other</option>

            </select>

            <input type="date" id="date">

            <button onclick="addTransaction()">

                Add Transaction

            </button>

        </div>

        <input type="text" id="search" placeholder="🔍 Search..." onkeyup="searchTransaction()">

        <h2>Transactions</h2>

        <ul id="transactionList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
